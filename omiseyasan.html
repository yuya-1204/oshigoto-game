<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>おみせやさん</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-user-select:none; user-select:none;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body { height:100%; overflow:hidden;
      font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic",sans-serif; }
  body { background:#f6f1e7; }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:16px; }
  .hidden { display:none !important; }

  /* ===== スタート画面 ===== */
  #scr-start { background:linear-gradient(#fdf7ec 60%, #f0e6d2);
      text-align:center; gap:28px; }
  .awning { position:absolute; top:0; left:0; right:0; height:56px;
      background:repeating-linear-gradient(90deg,#e8734a 0 60px,#fdf4e3 60px 120px);
      border-radius:0 0 22px 22px; }
  #scr-start h1 { font-size:52px; color:#6b4f2e; letter-spacing:4px; }
  .bigbtn { font-family:inherit; border:none; cursor:pointer;
      background:#e8734a; color:#fff; font-size:36px; font-weight:bold;
      padding:26px 60px; border-radius:60px; box-shadow:0 8px 0 #c05530;
      letter-spacing:3px; }
  .bigbtn:active { transform:translateY(5px); box-shadow:0 3px 0 #c05530; }
  .bigbtn.green { background:#4c9e5f; box-shadow:0 8px 0 #35744a; }
  .bigbtn.green:active { box-shadow:0 3px 0 #35744a; }
  .storefront { font-size:80px; }

  /* ===== ゲーム画面 ===== */
  #scr-game { justify-content:flex-start; gap:8px; padding-top:10px; }
  #topbar { width:100%; display:flex; align-items:center;
      justify-content:space-between; gap:10px; }
  #stamps { display:flex; gap:8px; font-size:30px; background:#fff;
      padding:6px 14px; border-radius:40px; border:2px solid #e5d9c3; }
  .stamp-empty { opacity:.25; }
  #btn-break { font-family:inherit; border:none; background:#7fa7c9; color:#fff;
      font-size:22px; padding:10px 22px; border-radius:40px;
      box-shadow:0 4px 0 #5d84a6; cursor:pointer; }
  #btn-gear { font-family:inherit; border:none; background:transparent;
      font-size:22px; opacity:.35; padding:8px; cursor:pointer; }

  #customer-area { display:flex; align-items:center; gap:14px; width:100%;
      max-width:820px; min-height:150px; }
  #customer { font-size:96px; transition:transform .3s; }
  #customer.happy { animation:hop .5s ease 2; }
  @keyframes hop { 50% { transform:translateY(-22px); } }
  #bubble { flex:1; background:#fff; border:3px solid #e5d9c3;
      border-radius:24px; padding:14px 20px; position:relative; }
  #bubble::before { content:""; position:absolute; left:-16px; top:44%;
      border:10px solid transparent; border-right-color:#e5d9c3; }
  #order-text { font-size:34px; color:#4a3a26; line-height:1.4; }
  #order-visual { font-size:40px; letter-spacing:8px; margin-top:4px; }
  #btn-listen { font-family:inherit; position:absolute; right:12px; top:10px;
      border:none; background:#f2e8d5; font-size:24px; border-radius:50%;
      width:52px; height:52px; cursor:pointer; }

  #shelf { display:grid; gap:14px; width:100%; max-width:820px;
      grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
  .item-btn { font-family:inherit; border:none; cursor:pointer;
      background:#fff; border:3px solid #e5d9c3; border-radius:22px;
      padding:12px 6px 8px; box-shadow:0 5px 0 #e0d3ba;
      display:flex; flex-direction:column; align-items:center; gap:2px; }
  .item-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #e0d3ba; }
  .item-btn .emo { font-size:64px; line-height:1.1; }
  .item-btn .name { font-size:20px; color:#6b5a40; }
  .item-btn.wobble { animation:wobble .4s; }
  @keyframes wobble { 25%{transform:translateX(-8px) rotate(-3deg);}
      75%{transform:translateX(8px) rotate(3deg);} }

  #bottom-area { width:100%; max-width:820px; display:flex;
      align-items:center; justify-content:space-between; min-height:120px; }
  #bag-zone { display:flex; align-items:center; gap:10px; }
  #bag { font-size:76px; }
  #remain { font-size:32px; color:#4a3a26; font-weight:bold;
      background:#fff; border-radius:20px; padding:10px 22px;
      border:2px solid #e5d9c3; }
  #btn-deliver { display:none; animation:pulse 1s infinite; }
  #btn-deliver.show { display:block; }
  @keyframes pulse { 50% { transform:scale(1.07); } }

  .fly { position:fixed; font-size:56px; z-index:60; pointer-events:none;
      margin-left:-28px; margin-top:-28px; transform:translate(0,0);
      transition:transform .65s cubic-bezier(.5,-.2,.7,1), opacity .65s; }
  .heart { position:fixed; font-size:40px; z-index:60; pointer-events:none;
      animation:floatup 1.4s ease-out forwards; }
  @keyframes floatup { to { transform:translateY(-130px) scale(1.5); opacity:0; } }

  /* ===== おわり画面 ===== */
  #scr-done { background:linear-gradient(#fdf7ec, #f7e9c8); gap:22px;
      text-align:center; }
  #scr-done h2 { font-size:44px; color:#6b4f2e; }
  #done-stamps { font-size:52px; letter-spacing:12px; }
  #done-msg { font-size:30px; color:#8a6d45; }
  .btnrow { display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }

  /* ===== きゅうけい ===== */
  #ov-break { position:absolute; inset:0; background:#dcebf5; z-index:80;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:30px; text-align:center; }
  #ov-break .zzz { font-size:90px; }
  #ov-break p { font-size:36px; color:#456;  }

  /* ===== スタッフ画面 ===== */
  #ov-staff { position:absolute; inset:0; background:rgba(40,40,40,.55);
      z-index:90; display:flex; align-items:center; justify-content:center; }
  #staff-panel { background:#fff; border-radius:18px; padding:24px;
      width:min(560px, 94vw); max-height:88vh; overflow-y:auto;
      font-size:17px; color:#333; }
  #staff-panel h3 { font-size:22px; margin-bottom:14px; }
  .setrow { display:flex; justify-content:space-between; align-items:center;
      padding:10px 0; border-bottom:1px solid #eee; gap:10px; }
  .setrow select { font-size:17px; padding:6px 10px; }
  #staff-panel table { width:100%; border-collapse:collapse; margin-top:8px;
      font-size:14px; }
  #staff-panel th, #staff-panel td { border:1px solid #ddd; padding:5px 8px;
      text-align:center; }
  .staffbtn { font-family:inherit; font-size:16px; padding:9px 18px;
      border-radius:10px; border:1px solid #bbb; background:#f4f4f4;
      cursor:pointer; margin-top:14px; }
  .staffbtn.primary { background:#4c9e5f; color:#fff; border:none; }
  .note { font-size:13px; color:#888; margin-top:10px; line-height:1.5; }
</style>
</head>
<body>

<!-- スタート -->
<div id="scr-start" class="screen">
  <div class="awning"></div>
  <div class="storefront">🏪</div>
  <h1>おみせやさん</h1>
  <button class="bigbtn" id="btn-open">おみせを ひらく</button>
</div>

<!-- ゲーム -->
<div id="scr-game" class="screen hidden">
  <div id="topbar">
    <button id="btn-gear" title="スタッフ用（長おし）">⚙</button>
    <div id="stamps"></div>
    <button id="btn-break">☕ きゅうけい</button>
  </div>
  <div id="customer-area">
    <div id="customer">🙂</div>
    <div id="bubble">
      <div id="order-text"></div>
      <div id="order-visual"></div>
      <button id="btn-listen" title="もういちど きく">🔊</button>
    </div>
  </div>
  <div id="shelf"></div>
  <div id="bottom-area">
    <div id="bag-zone">
      <div id="bag">🛍️</div>
      <div id="remain"></div>
    </div>
    <button class="bigbtn green" id="btn-deliver">はい どうぞ！</button>
  </div>
</div>

<!-- おわり -->
<div id="scr-done" class="screen hidden">
  <h2>きょうの おしごと おわり！</h2>
  <div id="done-stamps"></div>
  <div id="done-msg">おきゃくさんが みんな えがおに なったよ</div>
  <div class="btnrow">
    <button class="bigbtn" id="btn-again">もういちど</button>
    <button class="bigbtn green" id="btn-close">おしまい</button>
  </div>
</div>

<!-- きゅうけい -->
<div id="ov-break" class="hidden">
  <div class="zzz">☕</div>
  <p>ゆっくり やすんでね</p>
  <button class="bigbtn green" id="btn-resume">もどる</button>
</div>

<!-- スタッフ -->
<div id="ov-staff" class="hidden">
  <div id="staff-panel">
    <h3>スタッフ用メニュー</h3>
    <div class="setrow"><span>1回のお客さんの人数</span>
      <select id="set-customers">
        <option value="2">2人</option><option value="3">3人</option>
        <option value="5">5人</option>
      </select></div>
    <div class="setrow"><span>注文の最大個数</span>
      <select id="set-maxcount">
        <option value="2">2こまで</option><option value="3">3こまで</option>
        <option value="5">5こまで</option><option value="9">9こまで</option>
      </select></div>
    <div class="setrow"><span>棚に並べる品数</span>
      <select id="set-shelf">
        <option value="3">3種類</option><option value="4">4種類</option>
        <option value="6">6種類</option><option value="8">8種類</option>
      </select></div>
    <div class="setrow"><span>効果音</span>
      <select id="set-sound">
        <option value="1">あり</option><option value="0">なし</option>
      </select></div>
    <div class="setrow"><span>音声読み上げ</span>
      <select id="set-voice">
        <option value="1">あり</option><option value="0">なし</option>
      </select></div>
    <h3 style="margin-top:18px;">記録（この端末のみ・匿名）</h3>
    <table id="rec-table">
      <thead><tr><th>日時</th><th>接客数</th><th>タッチまちがい</th><th>所要時間</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="note">氏名などの個人情報は保存していません。記録は本人の順位付けではなく、
      「続けられた時間」「声かけの回数」など実際の様子と合わせて参考にしてください。</p>
    <div style="display:flex; gap:10px;">
      <button class="staffbtn primary" id="btn-staff-close">閉じる</button>
      <button class="staffbtn" id="btn-rec-clear">記録を消す</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ 設定・記録（端末内のみ、匿名） ============ */
const DEF = { customers:3, maxcount:3, shelf:4, sound:1, voice:1 };
function loadLS(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
let S = Object.assign({}, DEF, loadLS("omise_settings", {}));
let records = loadLS("omise_records", []);

/* ============ 音（Web Audio・やわらかい音のみ） ============ */
let actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq, delay, dur, gain){
  if(!S.sound) return; const c = audio(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t = c.currentTime + delay;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain||0.12, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.start(t); o.stop(t+dur+0.05);
}
const sndPut    = () => { tone(660,0,.18); };
const sndReady  = () => { tone(523,0,.18); tone(659,.13,.22); };
const sndThanks = () => { tone(523,0,.18); tone(659,.12,.18); tone(784,.24,.18); tone(1047,.36,.4,.14); };

/* ============ 読み上げ ============ */
function speak(text){
  if(!S.voice) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ============ データ ============ */
const ITEMS = [
  { e:"🍎", n:"りんご" },   { e:"🍌", n:"バナナ" },
  { e:"🍞", n:"パン" },     { e:"🥛", n:"ぎゅうにゅう" },
  { e:"🍙", n:"おにぎり" }, { e:"🍊", n:"みかん" },
  { e:"🥚", n:"たまご" },   { e:"🍅", n:"トマト" }
];
const FACES = ["🧑","👵","👴","👦","👧","👩","🧔","👱"];

/* ============ 状態 ============ */
let day = null;      // { served, wrong, start }
let order = null;    // { item, count, got, delivered }

const $ = id => document.getElementById(id);
function show(id){
  ["scr-start","scr-game","scr-done"].forEach(s => $(s).classList.add("hidden"));
  $(id).classList.remove("hidden");
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

/* ============ ゲーム進行 ============ */
function startDay(){
  day = { served:0, wrong:0, start:Date.now() };
  show("scr-game");
  renderStamps();
  nextCustomer();
}
function renderStamps(){
  const el = $("stamps"); el.innerHTML = "";
  for(let i=0;i<S.customers;i++){
    const s = document.createElement("span");
    s.textContent = "⭐";
    if(i >= day.served) s.className = "stamp-empty";
    el.appendChild(s);
  }
}
function nextCustomer(){
  const item = ITEMS[Math.floor(Math.random()*ITEMS.length)];
  const count = 1 + Math.floor(Math.random()*S.maxcount);
  order = { item, count, got:0, delivered:false };

  $("customer").textContent = FACES[Math.floor(Math.random()*FACES.length)];
  $("customer").classList.remove("happy");
  $("order-text").innerHTML =
    item.e + " " + item.n + "を <b style='font-size:44px'>" + count + "</b>こ ください";
  $("order-visual").textContent = Array(count).fill(item.e).join(" ");
  $("btn-deliver").classList.remove("show");
  updateRemain();

  // 棚：正解を必ず含める
  let pool = shuffle(ITEMS.filter(x => x.n !== item.n)).slice(0, S.shelf-1);
  pool.push(item);
  pool = shuffle(pool);
  const shelf = $("shelf"); shelf.innerHTML = "";
  pool.forEach(it => {
    const b = document.createElement("button");
    b.className = "item-btn";
    b.innerHTML = "<span class='emo'>" + it.e + "</span><span class='name'>" + it.n + "</span>";
    b.addEventListener("click", () => tapItem(b, it));
    shelf.appendChild(b);
  });

  speak(item.n + "を " + count + "こ ください");
}
function updateRemain(){
  const left = order.count - order.got;
  $("remain").textContent = left > 0 ? "あと " + left + "こ" : "ぜんぶ はいったよ！";
}
function tapItem(btn, it){
  if(!order || order.delivered) return;
  if(it.n === order.item.n && order.got < order.count){
    order.got++;
    fly(btn, $("bag"), it.e);
    sndPut();
    updateRemain();
    if(order.got === order.count){
      $("btn-deliver").classList.add("show");
      sndReady();
      speak("ぜんぶ はいったよ。はいどうぞ、を おしてね");
    }
  } else {
    if(it.n !== order.item.n) day.wrong++;  // 袋がいっぱいの時の正解タッチは誤りに数えない
    btn.classList.remove("wobble");
    void btn.offsetWidth;           // アニメ再発火
    btn.classList.add("wobble");
  }
}
function deliver(){
  if(!order || order.delivered || order.got < order.count) return;
  order.delivered = true;
  $("btn-deliver").classList.remove("show");
  $("order-text").innerHTML = "<b style='font-size:40px'>ありがとう！</b>";
  $("order-visual").textContent = "";
  $("customer").classList.add("happy");
  hearts($("customer"));
  sndThanks();
  speak("ありがとう！");
  day.served++;
  renderStamps();
  setTimeout(() => {
    if(day.served >= S.customers) endDay();
    else nextCustomer();
  }, 2000);
}
function endDay(){
  const sec = Math.round((Date.now() - day.start)/1000);
  records.push({ d:new Date().toLocaleString("ja-JP"), served:day.served, wrong:day.wrong, sec });
  if(records.length > 50) records = records.slice(-50);
  saveLS("omise_records", records);
  $("done-stamps").textContent = Array(day.served).fill("⭐").join(" ");
  show("scr-done");
  sndThanks();
  speak("きょうの おしごと おわり！ おつかれさま！");
}

/* ============ 演出 ============ */
function fly(fromEl, toEl, ch){
  const r1 = fromEl.getBoundingClientRect(), r2 = toEl.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "fly"; el.textContent = ch;
  el.style.left = (r1.left + r1.width/2) + "px";
  el.style.top  = (r1.top + r1.height/2) + "px";
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    const dx = (r2.left + r2.width/2) - (r1.left + r1.width/2);
    const dy = (r2.top + r2.height/2) - (r1.top + r1.height/2);
    el.style.transform = "translate(" + dx + "px," + dy + "px) scale(.4)";
    el.style.opacity = ".7";
  });
  setTimeout(() => el.remove(), 750);
}
function hearts(overEl){
  const r = overEl.getBoundingClientRect();
  for(let i=0;i<5;i++){
    const h = document.createElement("div");
    h.className = "heart"; h.textContent = "💛";
    h.style.left = (r.left + Math.random()*r.width) + "px";
    h.style.top  = (r.top + 10) + "px";
    h.style.animationDelay = (i*0.12) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1800);
  }
}

/* ============ スタッフ画面 ============ */
function openStaff(){
  $("set-customers").value = String(S.customers);
  $("set-maxcount").value  = String(S.maxcount);
  $("set-shelf").value     = String(S.shelf);
  $("set-sound").value     = String(S.sound);
  $("set-voice").value     = String(S.voice);
  const tb = $("rec-table").querySelector("tbody");
  tb.innerHTML = "";
  records.slice(-10).reverse().forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>"+r.d+"</td><td>"+r.served+"人</td><td>"+r.wrong+"回</td><td>"+r.sec+"秒</td>";
    tb.appendChild(tr);
  });
  $("ov-staff").classList.remove("hidden");
}
function closeStaff(){
  S.customers = parseInt($("set-customers").value, 10);
  S.maxcount  = parseInt($("set-maxcount").value, 10);
  S.shelf     = parseInt($("set-shelf").value, 10);
  S.sound     = parseInt($("set-sound").value, 10);
  S.voice     = parseInt($("set-voice").value, 10);
  saveLS("omise_settings", S);
  $("ov-staff").classList.add("hidden");
}

/* ============ イベント ============ */
$("btn-open").addEventListener("click", () => { audio(); startDay(); });
$("btn-deliver").addEventListener("click", deliver);
$("btn-listen").addEventListener("click", () => {
  if(order && !order.delivered) speak(order.item.n + "を " + order.count + "こ ください");
});
$("btn-again").addEventListener("click", startDay);
$("btn-close").addEventListener("click", () => show("scr-start"));
$("btn-break").addEventListener("click", () => $("ov-break").classList.remove("hidden"));
$("btn-resume").addEventListener("click", () => $("ov-break").classList.add("hidden"));
$("btn-staff-close").addEventListener("click", closeStaff);
$("btn-rec-clear").addEventListener("click", () => {
  records = []; saveLS("omise_records", records); openStaff();
});
// ⚙は誤タップ防止のため1.2秒長押しで開く
let gearTimer = null;
$("btn-gear").addEventListener("pointerdown", () => {
  gearTimer = setTimeout(openStaff, 1200);
});
["pointerup","pointerleave","pointercancel"].forEach(ev =>
  $("btn-gear").addEventListener(ev, () => clearTimeout(gearTimer)));
</script>
</body>
</html>
