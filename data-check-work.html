<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf8f1">
  <title>データ照合チェック｜おしごと練習</title>
  <link rel="stylesheet" href="ai-ready-practice.css">
</head>
<body data-game="check">
<main class="app">
  <div class="topbar">
    <a class="back-link" href="https://yamayu-sangyoui-oyama.localinfo.jp/pages/9891792/page_202607192003">← ネコゲームへ</a>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">効果音：オン</button>
  </div>
  <header class="hero">
    <p class="eyebrow">復職準備にも使える｜おしごと練習</p>
    <h1 data-game-title>データ照合チェック</h1>
    <p class="lead" data-game-lead></p>
    <p class="notice">これは練習用ゲームです。就労能力や復職可否を判定するものではありません。疲れたときは、いつでも中断してください。</p>
  </header>
  <section class="panel" id="startPanel">
    <h2>遊び方</h2>
    <ul class="rule-list">
      <li>全5問・100点満点です。</li>
      <li>時間制限や速さによる減点はありません。</li>
      <li>結果は今日の最高点だけ、この端末内に保存します。</li>
    </ul>
    <button class="primary" id="startButton" type="button">練習を始める</button>
  </section>
  <section class="panel" id="playPanel" hidden>
    <div class="progress-head"><span>問題</span><span id="progressText">1 / 5</span></div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    <div class="question-card">
      <h2 id="questionTitle"></h2>
      <p class="question-detail" id="questionDetail"></p>
    </div>
    <div class="choices" id="choices"></div>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <button class="secondary" id="nextButton" type="button" hidden>次の問題へ</button>
  </section>
  <section class="panel result-center" id="resultPanel" hidden>
    <h2>おつかれさまでした</h2>
    <div class="score-big" id="scoreText">0点</div>
    <p id="resultText"></p>
    <p><strong id="bestText"></strong></p>
    <button class="primary" id="replayButton" type="button">もう一度練習する</button>
  </section>
  <p class="footnote">入力内容と記録は外部送信されません。ブラウザのデータを消去すると保存記録も消えます。</p>
</main>
<script src="work-quiz.js"></script>
</body>
</html>
