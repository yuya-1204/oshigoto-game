<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf8f1">
  <title>ブロック崩し練習｜おしごと練習</title>
  <link rel="stylesheet" href="ai-ready-practice.css">
</head>
<body>
<main class="app">
  <div class="topbar">
    <a class="back-link" href="https://yamayu-sangyoui-oyama.localinfo.jp/pages/9891792/page_202607192003">← ネコゲームへ</a>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">効果音：オン</button>
  </div>
  <header class="hero">
    <p class="eyebrow">スマホ対応｜おしごと練習</p>
    <h1>ブロック崩し練習</h1>
    <p class="lead">バーを左右に動かしてボールを返し、3機がなくなるまでに消したブロック数を記録します。</p>
    <p class="notice">1日3回までです。速さや得点は、就労能力や復職可否を示すものではありません。疲れたときは中断してください。</p>
  </header>
  <section class="panel">
    <div class="status-grid" aria-live="polite">
      <div class="status-box"><span>消した数</span><strong id="score">0</strong></div>
      <div class="status-box"><span>残り</span><strong id="lives">3機</strong></div>
      <div class="status-box"><span>今日の最高</span><strong id="best">0</strong></div>
      <div class="status-box"><span>今日の回数</span><strong id="attempts">0 / 3</strong></div>
    </div>
    <div class="game-stage" id="stage">
      <canvas id="canvas" width="360" height="520" aria-label="ブロック崩しのゲーム画面"></canvas>
      <div class="game-overlay" id="overlay">
        <strong id="overlayTitle">ブロック崩し練習</strong>
        <p id="overlayText">3機で何個消せるか挑戦します。</p>
        <button class="primary" id="startButton" type="button">練習を開始</button>
      </div>
    </div>
    <div class="move-controls">
      <button class="move-button" id="leftButton" type="button">◀ 左へ</button>
      <button class="move-button" id="rightButton" type="button">右へ ▶</button>
    </div>
    <p class="feedback" id="feedback" role="status" aria-live="polite">画面を指で左右になぞるか、ボタンで操作します。パソコンでは左右の矢印キーも使えます。</p>
  </section>
  <p class="footnote">開始した時点で1回と数え、その日の最高成績だけをこの端末内に保存します。記録は外部送信されません。</p>
</main>
<script src="block-breaker-work.js"></script>
</body>
</html>
